<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Conciliador v2</title>
  <style>
    /* Tokens de color: claro por defecto, oscuro por preferencia del sistema o por data-theme */
    /* Tokens de referencia shadcn/ui (acromático; el rojo solo para errores). Modo oscuro derivado de la misma escala. */
    :root {
      --fondo: #f5f5f5; --superficie: #ffffff; --superficie-2: #fafafa; --texto: #0a0a0a; --sutil: #737373;
      --linea: #e5e5e5; --acento: #0a0a0a; --acento-texto: #fafafa;
      --ok: #166534; --ok-fondo: #f0fdf4; --aviso: #171717; --aviso-fondo: #f5f5f5; --error: #e7000b; --error-fondo: #fff1f2;
      --sombra: 0 0 0 1px rgba(23,23,23,.05), 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
      --radio: 24px; --radio-chico: 18px; --radio-anidado: 10px;
      --vidrio: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fondo: #0a0a0a; --superficie: #171717; --superficie-2: #1f1f1f; --texto: #fafafa; --sutil: #a3a3a3;
        --linea: #262626; --acento: #fafafa; --acento-texto: #0a0a0a;
        --ok: #4ade80; --ok-fondo: rgba(74,222,128,.12); --aviso: #e5e5e5; --aviso-fondo: #262626; --error: #ff4d4f; --error-fondo: rgba(231,0,11,.18);
        --sombra: none; --vidrio: #171717;
      }
    }
    :root[data-theme="dark"] {
      --fondo: #0a0a0a; --superficie: #171717; --superficie-2: #1f1f1f; --texto: #fafafa; --sutil: #a3a3a3;
      --linea: #262626; --acento: #fafafa; --acento-texto: #0a0a0a;
      --ok: #4ade80; --ok-fondo: rgba(74,222,128,.12); --aviso: #e5e5e5; --aviso-fondo: #262626; --error: #ff4d4f; --error-fondo: rgba(231,0,11,.18);
      --sombra: none; --vidrio: #171717;
    }

    /* Colores de estado: verde correcto, azul pendiente por hacer, ámbar revisar, rojo falta o error */
    :root { --ok: #166534; --ok-fondo: #dcfce7; --aviso: #92400e; --aviso-fondo: #fef3c7; --error: #b91c1c; --error-fondo: #fee2e2; --info: #1e40af; --info-fondo: #dbeafe; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #4ade80; --ok-fondo: rgba(74,222,128,.14); --aviso: #fbbf24; --aviso-fondo: rgba(251,191,36,.14); --error: #f87171; --error-fondo: rgba(248,113,113,.14); --info: #93c5fd; --info-fondo: rgba(147,197,253,.14); } }
    :root[data-theme="dark"] { --ok: #4ade80; --ok-fondo: rgba(74,222,128,.14); --aviso: #fbbf24; --aviso-fondo: rgba(251,191,36,.14); --error: #f87171; --error-fondo: rgba(248,113,113,.14); --info: #93c5fd; --info-fondo: rgba(147,197,253,.14); }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fondo); color: var(--texto);
      font: 14px/1.43 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .oculto { display: none !important; }
    .sutil { color: var(--sutil); margin: 0; font-size: 13px; }

    /* Barra superior translúcida: el contenido se desplaza por debajo */
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
      padding: 14px clamp(16px, 4vw, 40px);
      background: var(--vidrio); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--linea);
    }
    h1 { font-size: 24px; line-height: 1.33; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
    header .sutil { margin-top: 2px; }
    .acciones { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    header { justify-content: flex-start; }
    header { padding: 8px clamp(12px, 2vw, 24px); }
    header h2, header .sutil:not(.caja-empresa *) { font-size: 12px; }
    label.sutil { display: inline-flex; align-items: center; gap: 8px; }

    input.nit {
      width: 124px; padding: 8px 10px; font: inherit; color: var(--texto);
      background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio-chico);
      font-variant-numeric: tabular-nums; outline: none;
    }
    input.nit:focus { border-color: var(--acento); outline: 2px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 0; }

    button {
      font: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 18px; cursor: pointer;
      background: var(--superficie-2); color: var(--texto); border: 1px solid transparent;
      transition: transform .1s ease-out, background-color .15s ease, opacity .15s ease;
    }
    button:hover:not(:disabled) { background: var(--superficie-2); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    button.primario { background: var(--acento); color: var(--acento-texto); border-color: transparent; }
    button.primario:hover:not(:disabled) { background: color-mix(in srgb, var(--acento) 88%, transparent); }

    main { padding: clamp(12px, 2vw, 24px) clamp(12px, 2vw, 28px) 48px; }

    #estado {
      padding: 12px 16px; margin-bottom: 16px; border-radius: var(--radio-chico);
      background: var(--superficie); color: var(--sutil);
    }
    #estado.error { background: var(--error-fondo); color: var(--error); }

    .vacio {
      background: var(--superficie); border-radius: var(--radio);
      padding: clamp(20px, 4vw, 36px); max-width: 720px;
    }
    .vacio h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .vacio p { margin: 0 0 10px; color: var(--texto); }
    .vacio code {
      font: 13px ui-monospace, "SF Mono", Consolas, monospace; background: var(--superficie-2);
      padding: 2px 6px; border-radius: 6px;
    }

    /* Pestañas como control segmentado */

    /* Tarjetas de indicadores */
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .tarjeta {
      background: var(--superficie); border-radius: var(--radio);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
    }
    .tarjeta span { color: var(--sutil); font-size: 13px; font-weight: 500; }
    .tarjeta b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .tarjeta small { color: var(--sutil); font-size: 12.5px; line-height: 1.4; }

    .dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .dos > div { background: var(--superficie); border-radius: var(--radio); padding: 14px 16px 6px; }
    h3 { font-size: 16px; font-weight: 600; margin: 18px 0 10px; letter-spacing: -0.01em; }
    .dos h3 { margin-top: 4px; }

    /* Tablas */
    .tabla-wrap {
      overflow: auto; background: var(--superficie); border-radius: var(--radio);
      -webkit-overflow-scrolling: touch;
    }
    table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
    thead th {
      position: sticky; top: 0; z-index: 1; background: var(--superficie);
      font-size: 12px; font-weight: 600; color: var(--sutil); text-align: left;
      padding: 12px 12px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap;
    }
    tbody td {
      padding: 10px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--superficie-2); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.resumen { font-size: 14px; }
    table.resumen td { white-space: normal; padding: 8px 0; border-bottom: 1px solid var(--linea); }
    table.resumen tr:last-child td { border-bottom: 0; }
    table.resumen td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

    /* Estados como píldoras de color */
    .pildora {
      display: inline-block; padding: 2px 8px; border-radius: 18px; font-size: 12px; font-weight: 500;
      background: var(--superficie-2); color: var(--texto); white-space: nowrap;
    }
    .pildora.ok { background: var(--ok-fondo); color: var(--ok); }
    .pildora.aviso { background: var(--aviso-fondo); color: var(--aviso); }
    .pildora.error { background: var(--error-fondo); color: var(--error); }
    .pildora.info { background: var(--info-fondo); color: var(--info); }
    .pildora.neutro { background: var(--superficie-2); color: var(--sutil); }

    .filtro { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; color: var(--sutil); font-size: 13px; }
    select {
      font: inherit; font-size: 13px; padding: 7px 10px; border-radius: var(--radio-chico);
      background: var(--superficie); color: var(--texto); border: 1px solid var(--linea); outline: none;
    }
    select:focus-visible { border-color: var(--acento); outline: 2px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 0; }
    .boton-csv { font-size: 12px; padding: 5px 10px; }
    .boton-csv:disabled { opacity: .4; cursor: default; }
    input.cuenta {
      font: inherit; font-size: 13px; padding: 6px 9px; width: 120px; border-radius: 8px;
      background: var(--superficie); color: var(--texto); border: 1px solid var(--linea); outline: none;
      font-variant-numeric: tabular-nums;
    }
    input.cuenta:focus { border-color: var(--acento); outline: 2px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 0; }

    .avisos { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 8px; }
    .avisos li {
      background: var(--aviso-fondo); color: var(--aviso); border-radius: var(--radio-chico);
      padding: 10px 14px; font-size: 13.5px;
    }
    .vacio-tab { color: var(--sutil); padding: 24px 4px; margin: 0; }

    /* Movimiento suave al cambiar de pestaña */
    #vista > * { animation: aparecer .25s ease-out both; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

    /* Superficies planas: separación por borde fino, sin sombra en reposo */
    .tarjeta, .dos > div, .tabla-wrap, .vacio, #estado { border: 1px solid var(--linea); box-shadow: var(--sombra); }
    /* Indicadores: un solo contenedor dividido por líneas finas, etiqueta sobre valor */
    .tarjetas { gap: 0; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; }
    .tarjeta { border: 0; border-right: 1px solid var(--linea); border-radius: 0; box-shadow: none; padding: 14px 18px; }
    .tarjeta:last-child { border-right: 0; }
    .tarjeta b { font-size: 24px; }


    /* Esqueleto de carga: un bloque sólido se desliza sobre cada barra (transform, sin repintar el fondo) */
    .esqueleto { display: grid; gap: 14px; padding: 8px 0; }
    .barra-esqueleto { position: relative; height: 16px; border-radius: 8px; background: var(--superficie-2); overflow: hidden; }
    .barra-esqueleto::after { content: ""; position: absolute; inset: 0; background: var(--superficie); opacity: .7; transform: translateX(-100%); animation: deslizar 1.4s ease-in-out infinite; }
    @keyframes deslizar { to { transform: translateX(100%); } }
    /* Al cambiar de pantalla, las filas entran una tras otra (opacidad, máximo 15 filas) */
    .panel.animar tbody tr { animation: aparecer .22s ease-out both; animation-delay: calc(var(--i, 0) * 22ms); }
    /* Resumen clicable, valores copiables y ficha de tercero */
    .ir { cursor: pointer; }
    tr.ir:hover td { background: var(--superficie-2); }
    .tarjeta.ir:hover { background: var(--superficie-2); }
    .copiable { cursor: copy; border-radius: 6px; }
    .copiable:hover { color: var(--acento); }
    button.cufe { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: copy; text-decoration: underline dotted var(--sutil); text-underline-offset: 3px; border-radius: 4px; }
    button.cufe:hover { color: var(--acento); }
    button.tercero { font: inherit; color: var(--texto); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--linea); text-underline-offset: 3px; }
    button.tercero:hover { text-decoration-color: var(--texto); }
    .aviso-copia { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; background: var(--acento); color: var(--acento-texto); padding: 8px 14px; border-radius: 10px; font-size: 13px; transition: opacity .18s ease, transform .18s ease; }
    .aviso-copia.visible { opacity: 1; transform: translate(-50%, 0); }
    dialog.ficha { width: min(900px, calc(100vw - 32px)); height: min(640px, calc(100vh - 48px)); min-width: min(420px, calc(100vw - 32px)); min-height: 260px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); resize: both; overflow: auto; border: 1px solid var(--linea); border-radius: 18px; background: var(--superficie); color: var(--texto); padding: 20px 22px; }
    dialog.ficha::backdrop { background: rgba(0,0,0,.35); }
    .ficha-cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .ficha-cabecera h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .cerrar { font-size: 12px; padding: 5px 10px; border-radius: 10px; }
    .ficha-datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--linea); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .ficha-dato { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-right: 1px solid var(--linea); }
    .ficha-dato:last-child { border-right: 0; }
    .ficha-dato span { color: var(--sutil); font-size: 12px; }
    .ficha-dato b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .ficha-sec h3 { margin: 14px 0 6px; font-size: 14px; }
    dialog.ficha .tabla-wrap { max-height: none; }
    /* Encabezado fijo: cada tabla se desplaza por dentro y su encabezado queda arriba */
    .tabla-wrap { max-height: calc(100vh - var(--cabecera, 120px) - 190px); min-height: 200px; overflow: auto; }
    #vista.dividida .tabla-wrap { max-height: none; min-height: 0; overflow: visible; }
    thead th { top: 0; }
    th.ordenable { cursor: pointer; user-select: none; }
    th.ordenable:hover { color: var(--texto); }
    th .flecha { display: inline-block; width: 10px; margin-left: 4px; font-size: 10px; color: var(--texto); }
    th[aria-sort="ascending"] .flecha::after { content: "▲"; }
    th[aria-sort="descending"] .flecha::after { content: "▼"; }
    .totales { display: grid; gap: 4px; max-width: 360px; margin-left: auto; }
    .linea-total { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
    .linea-total b { font-variant-numeric: tabular-nums; }
    .linea-total.total-final { font-weight: 600; border-bottom: 0; font-size: 15px; }
    button.numero-xml { font: inherit; color: var(--texto); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted var(--sutil); text-underline-offset: 3px; }
    dialog.columnas { width: min(420px, calc(100vw - 32px)); height: auto; max-height: calc(100vh - 48px); }
    .lista-columnas { display: grid; gap: 8px; margin: 6px 0 12px; max-height: 50vh; overflow: auto; }
    .opcion-columna { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .opcion-columna input { width: 16px; height: 16px; accent-color: var(--acento); }
    .acciones-columnas button { font-size: 13px; padding: 6px 12px; }
    /* Dos pantallas: controles compactos para que quepan más datos */
    #vista.dividida .panel-cabecera { padding-bottom: 4px; }
    #vista.dividida .pestanas { gap: 4px; margin-bottom: 6px; }
    #vista.dividida .pestana { padding: 3px 9px; font-size: 11px; }
    #vista.dividida .barra-filtros { gap: 6px 8px; margin-bottom: 4px; }
    #vista.dividida .filtro { gap: 3px; font-size: 11px; }
    #vista.dividida .filtro > span { font-size: 11px; }
    #vista.dividida .filtro select, #vista.dividida .filtro input[type="search"], #vista.dividida .linea-tiempo input[type="date"] { font-size: 12px; padding: 4px 8px; min-width: 120px; border-radius: 10px; }
    #vista.dividida .filtro input[type="search"] { min-width: 150px; }
    #vista.dividida .linea-tiempo { gap: 6px; }
    #vista.dividida .rango-tiempo { display: none; }
    #vista.dividida .contador, #vista.dividida .boton-csv { font-size: 11px; }
    #vista.dividida .boton-csv { padding: 3px 8px; }
    /* Ancho de columnas: el tirador aparece al pasar sobre el borde del encabezado */
    thead th { position: sticky; }
    .tirador { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: col-resize; touch-action: none; }
    .tirador::after { content: ""; position: absolute; right: 3px; top: 25%; bottom: 25%; width: 2px; border-radius: 2px; background: transparent; transition: background-color .15s ease; }
    th:hover > .tirador::after, .tirador:active::after { background: var(--sutil); }
    table.redimensionada th, table.redimensionada td { overflow: hidden; text-overflow: ellipsis; }
    table.redimensionada th { white-space: nowrap; }
    .pie-version { color: var(--sutil); font-size: 11px; text-align: right; padding: 0 clamp(12px, 2vw, 28px) 12px; font-variant-numeric: tabular-nums; }
    /* Filtros, paneles y vista dividida */
    .barra-filtros { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 0 0 12px; }
    .filtro { display: inline-flex; flex-direction: column; gap: 6px; color: var(--texto); font-size: 13px; font-weight: 500; }
    .filtro > span { color: var(--sutil); font-size: 12px; }
    .filtro select, .filtro input[type="search"] {
      font: inherit; font-size: 14px; color: var(--texto); min-width: 200px; padding: 8px 12px;
      background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio-chico); outline: none;
    }
    .filtro input[type="search"] { min-width: 240px; }
    .filtro select:focus-visible, .filtro input:focus-visible { border-color: var(--acento); outline: 2px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 0; }
    .contador { color: var(--sutil); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; align-self: center; }
    .panel { min-width: 0; }
    /* Empresa y periodo en una caja redondeada, como en la referencia */
    .cuadro-control { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border: 1px solid var(--linea); background: var(--superficie); border-radius: 14px; padding: 3px 3px 3px 10px; }
    .cuadro-control .acciones { gap: 6px; }
    .cuadro-control .acciones button { font-size: 12px; padding: 5px 10px; border-radius: 10px; }
    .cuadro-control .caja-empresa { border: 0; background: none; padding: 0; font-size: 12px; color: var(--sutil); }
    .cuadro-control .caja-empresa b { font-size: 12px; color: var(--texto); }
    .cuadro-control .sutil { font-size: 11px; }
    header { align-items: center; }
    header .acciones { order: 1; }
    header .cabecera-tabs { order: 2; flex: 1 1 auto; display: flex; justify-content: center; min-width: 0; }
    header .cabecera-tabs:empty { display: none; }
    header .cabecera-tabs .pestanas { margin: 0; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
    header .cabecera-tabs .pestana { border-radius: 10px; }
    header .caja-empresa { order: 3; }
    header .cabecera-tabs { order: 2; }
    .caja-empresa { border: 1px solid var(--linea); background: var(--superficie); border-radius: var(--radio-chico); padding: 8px 14px; font-size: 14px; font-weight: 500; color: var(--texto); font-variant-numeric: tabular-nums; }
    /* Los controles de cada pantalla quedan fijos al desplazarse, debajo de la cabecera */
    .panel-cabecera { position: sticky; top: var(--cabecera, 64px); z-index: 5; background: var(--fondo); padding: 0 0 8px; margin-bottom: 4px; }
    /* Dos pantallas: cada una tiene su altura y se desplaza sola; la rueda mueve la que está bajo el cursor */
    #vista.dividida .panel { position: relative; height: calc(100vh - var(--cabecera, 64px) - 28px); display: flex; flex-direction: column; min-height: 0; }
    #vista.dividida .panel-cabecera { position: static; padding: 0 0 8px; }
    #vista.dividida .contenido { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-right: 2px; }
    @media (max-width: 1100px) { #vista.dividida .panel { height: auto; } #vista.dividida .contenido { overflow: visible; } }
    .panel-cabecera .pestanas { margin-bottom: 8px; }
    .panel-cabecera .barra-filtros { margin-bottom: 0; }
    #vista.dividida { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (max-width: 1100px) { #vista.dividida { grid-template-columns: minmax(0, 1fr); } }
    .panel + .panel { border-left: 0; }
    .contenido { min-width: 0; }
    .linea-tiempo { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
    .linea-tiempo input[type="date"] { font: inherit; font-size: 14px; color: var(--texto); padding: 8px 12px; background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio-chico); outline: none; }
    .linea-tiempo input[type="date"]:focus-visible { border-color: var(--acento); outline: 2px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 0; }
    .rango-tiempo { color: var(--sutil); font-size: 12px; align-self: center; font-variant-numeric: tabular-nums; }
    /* Pestañas: botones cuadrados redondeados; la seleccionada usa el color del botón principal */
    .pestanas { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin-bottom: 10px; background: none; border: 0; border-radius: 0; max-width: 100%; }
    .pestana { background: var(--superficie); color: var(--texto); border: 1px solid var(--linea); border-radius: 10px; padding: 5px 12px; font-size: 12px; font-weight: 500; white-space: nowrap; transition: background-color .18s ease, color .18s ease, border-color .18s ease; }
    .pestana:hover:not(.activa) { background: var(--superficie-2); color: var(--texto); }
    .pestana.activa { background: var(--acento); color: var(--acento-texto); border-color: transparent; box-shadow: none; }
    .pestana:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      h1 { font-size: 18px; }
      .acciones { width: 100%; }
      .filtro select, .filtro input[type="search"] { min-width: 0; width: 100%; }
      .acciones > button, .acciones > label { flex: 1 1 auto; justify-content: center; }
      .tarjeta b { font-size: 22px; }
    }

    /* Accesibilidad: sin movimiento ni transparencias si el usuario lo pide */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      button:active:not(:disabled) { transform: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      header { background: var(--superficie); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    @media (prefers-contrast: more) {
      :root { --linea: rgba(0,0,0,.35); }
    }
  </style>
</head>
